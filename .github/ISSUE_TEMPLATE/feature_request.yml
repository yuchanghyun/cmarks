name: Feature request
description: Suggest something cmarks should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What do you read, how, and where does cmarks get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like cmarks to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
