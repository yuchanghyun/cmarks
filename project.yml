# XcodeGen 정의. `make gen`이 cmarks.xcodeproj를 생성한다.
name: cmarks
options:
  bundleIdPrefix: com.changhyunyoo
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # 로컬 실행용 ad-hoc 서명. 팀 계정이 있으면 DEVELOPMENT_TEAM을 넣고 CODE_SIGN_IDENTITY 줄을 지운다.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

packages:
  MarkdownCore:
    path: Packages/MarkdownCore
  LayoutKit:
    path: Packages/LayoutKit
  FileKit:
    path: Packages/FileKit
  Sparkle:                          # 자동 업데이트(App Store 밖 배포용). 도구: <DerivedData>/SourcePackages/artifacts/sparkle/Sparkle/bin
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"

targetTemplates:
  cmarksApp:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - web
          - "web/**"
      - path: App/Resources/web      # 폴더 참조: 번들의 Resources/web 으로 그대로 복사
        type: folder
        buildPhase: resources
      - path: scripts/cmarks         # CLI 스크립트를 번들에 함께 넣는다(Homebrew cask binary, 수동 설치용)
        buildPhase: resources
    dependencies:
      - package: MarkdownCore
      - package: LayoutKit
      - package: FileKit
      - target: cmarksQuickLook        # Finder Quick Look 미리보기 확장(PlugIns에 내장)
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_NAME: cmarks
        PRODUCT_BUNDLE_IDENTIFIER: com.changhyunyoo.cmarks
        MARKETING_VERSION: 1.3.8
        CURRENT_PROJECT_VERSION: 15
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ${infoPath}
      properties:
        CFBundleName: cmarks
        CFBundleDisplayName: cmarks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Changhyun Yoo"
        # Finder "다음으로 열기" / 드래그&드롭 대상. Alternate = 사용자가 기본 앱으로 지정할 때만 기본.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.folder
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdtxt, mdtext, mdx, qmd, rmd]
              public.mime-type: [text/markdown, text/x-markdown]
        # 탭 드래그(Transferable) 전용 타입
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.changhyunyoo.cmarks.tab
            UTTypeDescription: cmarks tab reference
            UTTypeConformsTo:
              - public.data
        # 딥링크: cmarks://open?path=/abs/or/~path
        CFBundleURLTypes:
          - CFBundleURLName: com.changhyunyoo.cmarks
            CFBundleURLSchemes: [cmarks]
            CFBundleTypeRole: Viewer
        # 서비스 메뉴. NSMessage는 ServicesProvider의 셀렉터 이름과 일치해야 한다.
        NSServices:
          - NSMenuItem:
              default: cmarks로 열기
            NSMessage: openInCmarks
            NSPortName: cmarks
            NSSendFileTypes:
              - net.daringfireball.markdown
              - public.folder


targets:
  # GitHub 판: Developer ID + Sparkle, 샌드박스 끔(ADR-5).
  cmarks:
    templates: [cmarksApp]
    templateAttributes:
      infoPath: App/Info.plist
    dependencies:
      - package: Sparkle
    settings:
      base:
        # Sparkle EdDSA 공개 키. `generate_keys`가 출력한 값. 비어 있으면 release.sh가 appcast 생성을 거부한다.
        SPARKLE_PUBLIC_ED_KEY: "StZ0ga0h3/woXQbLX7rYKQbuUN3NuOKwKyQ0yF0vL9o="
    info:
      path: App/Info.plist
      properties:
        # 보기 ▸ Finder 선택 따라가기(Apple Events로 Finder 선택 항목을 읽는다)
        NSAppleEventsUsageDescription: "Finder에서 선택한 마크다운 파일을 따라가기 위해 Finder의 선택 항목을 읽습니다. / Reads the Finder selection so cmarks can follow it."
        # Sparkle 자동 업데이트. appcast는 main 브랜치의 appcast.xml, 업데이트 zip은 GitHub Releases.
        SUFeedURL: https://raw.githubusercontent.com/yuchanghyun/cmarks/main/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
    entitlements:
      path: App/cmarks.entitlements
      properties:
        com.apple.security.app-sandbox: false   # ADR-5: v1은 샌드박스 끔
        # hardened runtime에서 다른 앱(Finder)에 Apple Event를 보내려면 필요. 없으면 TCC가 프롬프트 없이 거부한다(-1743).
        com.apple.security.automation.apple-events: true
    scheme:
      testTargets:
        - cmarksTests

  # Mac App Store 판(APPSTORE.md): 샌드박스 + 보안 범위 북마크, Sparkle·Finder 따라가기 없음. 같은 번들 ID.
  # 빌드는 `make build-appstore`(derivedData가 다르다: build-appstore/).
  cmarks-appstore:
    templates: [cmarksApp]
    templateAttributes:
      infoPath: App/Info-appstore.plist
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
    info:
      path: App/Info-appstore.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/cmarks-appstore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        # WKWebView의 WebContent 프로세스가 샌드박스 앱에서 뜨려면 필요하다(없으면 "web process failed to launch"). 앱 자체는 네트워크에 나가지 않는다.
        com.apple.security.network.client: true

  cmarksQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook/Sources
    dependencies:
      - package: MarkdownCore
    # 정적 미리보기에 필요한 CSS·하이라이터·KaTeX·이모지 표만 확장 번들에 복사한다(mermaid 등 제외, 약 1MB).
    postCompileScripts:
      - name: Copy web assets for static preview
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/web"
          mkdir -p "$DEST"
          rsync -a --delete --exclude 'vendor/mermaid' --exclude 'vendor/morphdom' --exclude 'app.js' --exclude 'index.html' --exclude 'VERSIONS.json' "${SRCROOT}/App/Resources/web/" "$DEST/"
        inputFiles:
          - $(SRCROOT)/App/Resources/web/app.css
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/web/app.css
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_NAME: cmarksQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: com.changhyunyoo.cmarks.quicklook
        MARKETING_VERSION: 1.3.8
        CURRENT_PROJECT_VERSION: 15
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated   # QLPreviewProvider는 임의 스레드에서 불린다
        ENABLE_USER_SCRIPT_SANDBOXING: NO            # web 자산 복사 스크립트가 번들에 써야 한다
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleName: cmarksQuickLook
        CFBundleDisplayName: cmarks Markdown Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Changhyun Yoo"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes:
              - net.daringfireball.markdown
            QLSupportsSearchableItems: false
    entitlements:
      path: QuickLook/cmarksQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.cs.allow-jit: true          # JavaScriptCore(하이라이팅·KaTeX)

  cmarksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: cmarks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.changhyunyoo.cmarksTests
        GENERATE_INFOPLIST_FILE: YES
